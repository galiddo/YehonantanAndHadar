<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save the Date — Hadar & Yehonatan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --beige: #F7F4EF;
      --pink: #EE5C74;
      --pink-soft: rgba(238, 92, 116, 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      font-family: 'Dancing Script', cursive;
      background: var(--beige);
      color: var(--pink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      padding-left: max(1.5rem, env(safe-area-inset-left));
      padding-right: max(1.5rem, env(safe-area-inset-right));
      padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
      overflow-x: hidden;
    }

    .container {
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    .title {
      font-size: clamp(2.75rem, 11vw, 3.75rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--pink);
      margin-bottom: 0.35rem;
      line-height: 1.1;
    }

    .names {
      font-size: clamp(1.85rem, 6.5vw, 2.4rem);
      font-weight: 600;
      text-transform: uppercase;
      color: var(--pink);
      margin-bottom: 0.85rem;
      letter-spacing: 0.02em;
    }

    .heart {
      width: clamp(60px, 20vw, 88px);
      height: clamp(60px, 20vw, 88px);
      margin: 0.6rem auto 1.5rem;
      color: var(--pink);
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 0.6rem;
      margin-bottom: 1.75rem;
    }

    .countdown-unit {
      background: #fff;
      padding: 1rem 0.6rem;
      min-width: 0;
      flex: 1 1 0;
      max-width: 88px;
      border: 2px solid var(--pink);
      border-radius: 14px;
    }

    .countdown-value {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.9rem, 8.5vw, 2.5rem);
      font-weight: 700;
      color: var(--pink);
      display: block;
      line-height: 1.1;
    }

    .countdown-label {
      font-size: clamp(0.9rem, 3.5vw, 1.05rem);
      font-weight: 600;
      text-transform: uppercase;
      color: var(--pink);
      margin-top: 0.2rem;
      letter-spacing: 0.02em;
    }

    .date {
      font-size: clamp(1.6rem, 5.5vw, 2rem);
      font-weight: 600;
      text-transform: uppercase;
      color: var(--pink);
      margin-bottom: 0.3rem;
      letter-spacing: 0.02em;
    }

    .location {
      font-size: clamp(1.35rem, 4.5vw, 1.6rem);
      font-weight: 600;
      text-transform: uppercase;
      color: var(--pink);
      margin-bottom: 1.75rem;
      letter-spacing: 0.02em;
    }

    .add-to-calendar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 56px;
      padding: 1rem 2.25rem;
      font-family: 'Dancing Script', cursive;
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: #fff;
      background: var(--pink);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
      transition: transform 0.15s, opacity 0.15s;
      box-shadow: 0 4px 16px var(--pink-soft);
    }

    .add-to-calendar:hover,
    .add-to-calendar:focus {
      opacity: 0.95;
      transform: scale(1.02);
    }

    .add-to-calendar:active {
      transform: scale(0.98);
    }

    .add-to-calendar svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">Save the Date</h1>
    <p class="names">Hadar + Yehonatan</p>
    <svg class="heart" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
    <div class="countdown">
      <div class="countdown-unit">
        <span class="countdown-value" id="days">—</span>
        <span class="countdown-label">Days</span>
      </div>
      <div class="countdown-unit">
        <span class="countdown-value" id="hours">—</span>
        <span class="countdown-label">Hours</span>
      </div>
      <div class="countdown-unit">
        <span class="countdown-value" id="minutes">—</span>
        <span class="countdown-label">Mins</span>
      </div>
      <div class="countdown-unit">
        <span class="countdown-value" id="seconds">—</span>
        <span class="countdown-label">Secs</span>
      </div>
    </div>
    <p class="date" id="wedding-date">4 September 2026</p>
    <p class="location">"Mona" Jerusalem</p>
    <a href="#" id="add-to-calendar" class="add-to-calendar" download="wedding.ics">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      Add to Calendar
    </a>
  </div>

  <script>
    const weddingDate = new Date('2026-09-04T14:00:00');

    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');

    function formatDisplayDate(d) {
      const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
    }

    var el = document.getElementById('wedding-date');
    if (el) el.textContent = formatDisplayDate(weddingDate);

    function updateCountdown() {
      const now = new Date();
      const diff = weddingDate - now;

      if (diff <= 0) {
        daysEl.textContent = '0';
        hoursEl.textContent = '00';
        minutesEl.textContent = '00';
        secondsEl.textContent = '00';
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const seconds = totalSeconds % 60;
      const totalMinutes = Math.floor(totalSeconds / 60);
      const minutes = totalMinutes % 60;
      const totalHours = Math.floor(totalMinutes / 60);
      const hours = totalHours % 24;
      const days = Math.floor(totalHours / 24);

      daysEl.textContent = days;
      hoursEl.textContent = String(hours).padStart(2, '0');
      minutesEl.textContent = String(minutes).padStart(2, '0');
      secondsEl.textContent = String(seconds).padStart(2, '0');
    }

    function formatICSDate(d) {
      return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
    }

    function downloadCalendar() {
      const start = formatICSDate(weddingDate);
      const end = formatICSDate(new Date(weddingDate.getTime() + 4 * 60 * 60 * 1000));
      const ics = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Wedding Countdown//EN',
        'BEGIN:VEVENT',
        'UID:wedding-' + start + '@countdown',
        'DTSTAMP:' + formatICSDate(new Date()),
        'DTSTART:' + start,
        'DTEND:' + end,
        'SUMMARY:Hadar & Yehonatan Wedding',
        'DESCRIPTION:Save the date! We can\'t wait to celebrate with you.',
        'LOCATION:Mona, Jerusalem',
        'END:VEVENT',
        'END:VCALENDAR'
      ].join('\r\n');

      const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.getElementById('add-to-calendar');
      a.href = url;
      a.download = 'wedding.ics';
      a.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById('add-to-calendar').addEventListener('click', function(e) {
      e.preventDefault();
      downloadCalendar();
    });

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
