<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="light"/>
  <title>יהונתן & הדר</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;600&family=Heebo:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --bg:        #faf6f1;
      --gold:      #b08968;
      --gold-soft: #d4baa0;
      --text:      #2a2a2a;
      --muted:     #7a7066;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Frank Ruhl Libre', 'Playfair Display', Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(env(safe-area-inset-top), 64px) 28px max(env(safe-area-inset-bottom), 64px);
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 44px;
    }

    .header {
      text-align: center;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .eyebrow {
      font-family: 'Heebo', system-ui, sans-serif;
      font-size: 0.92rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: var(--gold);
    }

    .divider {
      width: 88px;
      height: 1px;
      background: var(--gold);
      opacity: 0.65;
    }

    .names {
      font-family: 'Frank Ruhl Libre', 'Playfair Display', Georgia, serif;
      font-size: clamp(2.4rem, 10vw, 3rem);
      font-weight: 500;
      line-height: 1.2;
      color: var(--text);
    }

    .heart-icon {
      width: 32px;
      height: 32px;
      color: var(--gold);
      animation: heartbeat 2.6s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15%, 35% { transform: scale(1.12); }
      25%, 45% { transform: scale(0.96); }
    }

    .event-info {
      text-align: center;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .event-date {
      font-family: 'Frank Ruhl Libre', 'Playfair Display', Georgia, serif;
      font-size: clamp(1.6rem, 7vw, 2rem);
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .event-location {
      font-family: 'Heebo', system-ui, sans-serif;
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      margin-top: 4px;
    }

    .btn {
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 2px;
      padding: 16px 22px;
      font-family: 'Heebo', system-ui, sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover, .btn:active {
      background: var(--gold);
      color: #fff;
    }

    /* Bottom sheet */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 18, 14, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 500;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }

    .sheet {
      width: 100%;
      background: var(--bg);
      border-radius: 20px 20px 0 0;
      padding: 14px 22px max(env(safe-area-inset-bottom), 32px);
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.32,0.72,0,1);
    }
    .overlay.open .sheet { transform: translateY(0); }

    .handle {
      width: 42px;
      height: 3px;
      background: var(--gold-soft);
      border-radius: 2px;
      margin: 0 auto 22px;
    }

    .sheet-title {
      font-family: 'Heebo', system-ui, sans-serif;
      font-size: 0.92rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-align: center;
      color: var(--gold);
      margin-bottom: 18px;
    }

    .opt {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      border: 1px solid var(--gold-soft);
      border-radius: 4px;
      margin-bottom: 10px;
      cursor: pointer;
      text-decoration: none;
      color: var(--text);
      background: #fff;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .opt:hover, .opt:active {
      background: #fbf6ef;
      border-color: var(--gold);
    }

    .opt-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      color: var(--gold);
    }

    .opt-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .opt-name {
      font-family: 'Frank Ruhl Libre', 'Playfair Display', Georgia, serif;
      font-size: 1.05rem;
      font-weight: 500;
    }

    .opt-desc {
      font-family: 'Heebo', system-ui, sans-serif;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .sheet-cancel {
      width: 100%;
      padding: 16px;
      margin-top: 6px;
      background: transparent;
      border: 1px solid var(--gold);
      border-radius: 2px;
      color: var(--gold);
      font-family: 'Heebo', system-ui, sans-serif;
      font-size: 0.92rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, color 0.15s;
    }
    .sheet-cancel:hover, .sheet-cancel:active {
      background: var(--gold);
      color: #fff;
    }
  </style>
</head>

<body>
  <main>

    <div class="header">
      <div class="eyebrow">שמרו את התאריך</div>
      <div class="divider"></div>
      <div class="names">יהונתן &amp; הדר</div>
      <svg class="heart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 20.5s-7-4.4-7-10.4C5 6.7 6.9 5 9 5c1.4 0 2.4 0.9 3 2 0.6-1.1 1.6-2 3-2 2.1 0 4 1.7 4 5.1 0 6-7 10.4-7 10.4z"/>
      </svg>
    </div>

    <div class="event-info">
      <div class="event-date">4 בספטמבר 2026</div>
      <div class="event-location">מונה · ירושלים</div>
    </div>

    <div class="button-group">
      <button class="btn" onclick="openSheet()">הוספה ליומן</button>
      <a class="btn" href="https://ul.waze.com/ul?q=Mona%20Jerusalem&navigate=yes" target="_blank" rel="noopener">ניווט עם Waze</a>
      <a class="btn" href="https://open.spotify.com/playlist/3K7p8dvlss3klkHgZacXag?si=Ttohk8EtRuGqMfXL3Uy9BA&pi=2SG9bgXJRtGEJ" target="_blank" rel="noopener">פלייליסט החתונה</a>
    </div>

  </main>

  <div class="overlay" id="overlay" onclick="maybeClose(event)">
    <div class="sheet">
      <div class="handle"></div>
      <p class="sheet-title">הוספה ליומן</p>

      <div class="opt" onclick="downloadICS()">
        <div class="opt-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="5" width="18" height="16" rx="2"/>
            <path d="M3 10h18"/>
            <path d="M8 3v4M16 3v4"/>
          </svg>
        </div>
        <div class="opt-text">
          <span class="opt-name">יומן Apple</span>
          <span class="opt-desc">הורדת קובץ .ics</span>
        </div>
      </div>

      <a class="opt" id="gcal-link" href="#" target="_blank" rel="noopener">
        <div class="opt-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="5" width="18" height="16" rx="2"/>
            <path d="M3 10h18"/>
            <path d="M8 3v4M16 3v4"/>
            <path d="M8 14h2M14 14h2M8 18h2"/>
          </svg>
        </div>
        <div class="opt-text">
          <span class="opt-name">יומן Google</span>
          <span class="opt-desc">נפתח בדפדפן</span>
        </div>
      </a>

      <button class="sheet-cancel" onclick="closeSheet()">ביטול</button>
    </div>
  </div>

  <script>
    function openSheet() {
      var gcal = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
        + '&text=' + encodeURIComponent('החתונה של יהונתן והדר')
        + '&dates=20260904T150000/20260904T220000'
        + '&details=' + encodeURIComponent('מונה ירושלים')
        + '&location=' + encodeURIComponent('מונה ירושלים');
      document.getElementById('gcal-link').href = gcal;
      document.getElementById('overlay').classList.add('open');
    }

    function closeSheet() {
      document.getElementById('overlay').classList.remove('open');
    }

    function maybeClose(e) {
      if (e.target === document.getElementById('overlay')) closeSheet();
    }

    function downloadICS() {
      var lines = [
        'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Wedding//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
        'BEGIN:VEVENT','UID:hadar-yehonatan@2026','DTSTART:20260904T150000','DTEND:20260904T220000',
        'SUMMARY:החתונה של יהונתן והדר',
        'DESCRIPTION:מונה ירושלים',
        'LOCATION:מונה ירושלים',
        'STATUS:CONFIRMED','TRANSP:OPAQUE',
        'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:החתונה מחר!','END:VALARM',
        'END:VEVENT','END:VCALENDAR'
      ].join('\r\n');
      var blob = new Blob([lines], {type:'text/calendar;charset=utf-8'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'hadar-yehonatan-wedding.ics';
      a.click();
      URL.revokeObjectURL(url);
      setTimeout(closeSheet, 300);
    }
  </script>
</body>
</html>
