<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="light"/>
  <title>הדר ויהונתן מתחתנים</title>

  <style>
    @font-face {
      font-family: 'Ellinia CLM';
      font-weight: 300;
      font-style: normal;
      font-display: swap;
      src: url('fonts/elliniaclm-light-webfont.woff') format('woff'),
           url('fonts/elliniaclm-light-webfont.ttf') format('truetype');
    }
    @font-face {
      font-family: 'Ellinia CLM';
      font-weight: 300;
      font-style: italic;
      font-display: swap;
      src: url('fonts/elliniaclm-lightitalic-webfont.woff') format('woff'),
           url('fonts/elliniaclm-lightitalic-webfont.ttf') format('truetype');
    }
    @font-face {
      font-family: 'Ellinia CLM';
      font-weight: 700;
      font-style: normal;
      font-display: swap;
      src: url('fonts/elliniaclm-bold-webfont.woff') format('woff'),
           url('fonts/elliniaclm-bold-webfont.ttf') format('truetype');
    }
    @font-face {
      font-family: 'Ellinia CLM';
      font-weight: 700;
      font-style: italic;
      font-display: swap;
      src: url('fonts/elliniaclm-bolditalic-webfont.woff') format('woff'),
           url('fonts/elliniaclm-bolditalic-webfont.ttf') format('truetype');
    }

    :root {
      --bg:        #faf6f1;
      --gold:      #b08968;
      --gold-soft: #d4baa0;
      --text:      #2a2a2a;
      --muted:     #7a7066;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Ellinia CLM', Georgia, serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(env(safe-area-inset-top), 64px) 28px max(env(safe-area-inset-bottom), 64px);
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    .header {
      text-align: center;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .names {
      font-family: 'Ellinia CLM', Georgia, serif;
      font-weight: 700;
      font-size: clamp(2rem, 8.5vw, 2.6rem);
      line-height: 1.25;
      color: var(--text);
    }

    .heart-icon {
      width: 32px;
      height: 32px;
      color: var(--gold);
      animation: heartbeat 2.6s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15%, 35% { transform: scale(1.12); }
      25%, 45% { transform: scale(0.96); }
    }

    .divider {
      width: 88px;
      height: 1px;
      background: var(--gold);
      opacity: 0.65;
    }

    .event-info {
      text-align: center;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .event-date {
      font-family: 'Ellinia CLM', Georgia, serif;
      font-weight: 700;
      font-size: clamp(1.6rem, 7vw, 2rem);
      letter-spacing: 0.04em;
    }

    .event-location {
      font-family: 'Ellinia CLM', Georgia, serif;
      font-weight: 300;
      font-size: 1rem;
      color: var(--text);
    }

    .event-address {
      font-family: 'Ellinia CLM', Georgia, serif;
      font-weight: 300;
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: -2px;
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      margin-top: 4px;
    }

    .btn-tile {
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 4px;
      padding: 18px 12px;
      font-family: 'Ellinia CLM', Georgia, serif;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      aspect-ratio: 1;
    }

    .btn-tile:hover, .btn-tile:active {
      background: var(--gold);
      color: #fff;
    }

    .btn-tile-icon {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
    }

    .btn-tile-label {
      font-weight: 700;
      font-size: 0.92rem;
      text-align: center;
      line-height: 1.2;
    }

    /* Bottom sheet */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 18, 14, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 500;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }

    .sheet {
      width: 100%;
      background: var(--bg);
      border-radius: 20px 20px 0 0;
      padding: 14px 22px max(env(safe-area-inset-bottom), 32px);
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.32,0.72,0,1);
    }
    .overlay.open .sheet { transform: translateY(0); }

    .handle {
      width: 42px;
      height: 3px;
      background: var(--gold-soft);
      border-radius: 2px;
      margin: 0 auto 22px;
    }

    .sheet-title {
      font-family: 'Ellinia CLM', Georgia, serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.03em;
      text-align: center;
      color: var(--gold);
      margin-bottom: 18px;
    }

    .opt {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      border: 1px solid var(--gold-soft);
      border-radius: 4px;
      margin-bottom: 10px;
      cursor: pointer;
      text-decoration: none;
      color: var(--text);
      background: #fff;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .opt:hover, .opt:active {
      background: #fbf6ef;
      border-color: var(--gold);
    }

    .opt-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      color: var(--gold);
    }

    .opt-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .opt-name {
      font-family: 'Ellinia CLM', Georgia, serif;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .opt-desc {
      font-family: 'Ellinia CLM', Georgia, serif;
      font-weight: 300;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .sheet-cancel {
      width: 100%;
      padding: 15px;
      margin-top: 6px;
      background: transparent;
      border: 1px solid var(--gold);
      border-radius: 2px;
      color: var(--gold);
      font-family: 'Ellinia CLM', Georgia, serif;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, color 0.15s;
    }
    .sheet-cancel:hover, .sheet-cancel:active {
      background: var(--gold);
      color: #fff;
    }
  </style>
</head>

<body>
  <main>

    <div class="header">
      <div class="names">הדר ויהונתן מתחתנים</div>
      <svg class="heart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 20.5s-7-4.4-7-10.4C5 6.7 6.9 5 9 5c1.4 0 2.4 0.9 3 2 0.6-1.1 1.6-2 3-2 2.1 0 4 1.7 4 5.1 0 6-7 10.4-7 10.4z"/>
      </svg>
      <div class="divider"></div>
    </div>

    <div class="event-info">
      <div class="event-date">4.9.2026</div>
      <div class="event-location">מונא · ירושלים</div>
      <div class="event-address">שמואל הנגיד 12, ירושלים</div>
    </div>

    <div class="button-grid">
      <button class="btn-tile" onclick="openSheet()">
        <svg class="btn-tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="5" width="18" height="16" rx="2"/>
          <path d="M3 10h18"/>
          <path d="M8 3v4M16 3v4"/>
        </svg>
        <span class="btn-tile-label">הוסף את התאריך ליומן</span>
      </button>

      <a class="btn-tile" href="https://www.waze.com/ul?q=%D7%97%D7%A0%D7%99%D7%95%D7%9F%20%D7%9E%D7%95%D7%A0%D7%90%20%D7%99%D7%A8%D7%95%D7%A9%D7%9C%D7%99%D7%9D&navigate=yes" target="_blank" rel="noopener">
        <svg class="btn-tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="4" width="16" height="16" rx="2"/>
          <path d="M9.5 17V7.5h3.2a3 3 0 010 6H9.5"/>
        </svg>
        <span class="btn-tile-label">ניווט לחניית אורחים</span>
      </a>

      <a class="btn-tile" href="https://open.spotify.com/playlist/3K7p8dvlss3klkHgZacXag?si=Ttohk8EtRuGqMfXL3Uy9BA&pi=2SG9bgXJRtGEJ" target="_blank" rel="noopener">
        <svg class="btn-tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 18V6l11-2v12"/>
          <ellipse cx="6.5" cy="18" rx="2.5" ry="2"/>
          <ellipse cx="17.5" cy="16" rx="2.5" ry="2"/>
        </svg>
        <span class="btn-tile-label">פלייליסט להנעים את הנסיעה</span>
      </a>

      <button class="btn-tile" type="button">
        <svg class="btn-tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
          <rect x="3.5" y="5" width="17" height="11" rx="2"/>
          <path d="M3.5 12h17"/>
          <path d="M7 9h3M14 9h3"/>
          <circle cx="8" cy="18" r="1.4"/>
          <circle cx="16" cy="18" r="1.4"/>
          <path d="M6.6 16H4.5M19.5 16h-2.1"/>
        </svg>
        <span class="btn-tile-label">הרשמה להסעה</span>
      </button>
    </div>

  </main>

  <div class="overlay" id="overlay" onclick="maybeClose(event)">
    <div class="sheet">
      <div class="handle"></div>
      <p class="sheet-title">הוספה ליומן</p>

      <div class="opt" onclick="downloadICS()">
        <div class="opt-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="5" width="18" height="16" rx="2"/>
            <path d="M3 10h18"/>
            <path d="M8 3v4M16 3v4"/>
          </svg>
        </div>
        <div class="opt-text">
          <span class="opt-name">יומן Apple</span>
          <span class="opt-desc">הורדת קובץ .ics</span>
        </div>
      </div>

      <a class="opt" id="gcal-link" href="#" target="_blank" rel="noopener">
        <div class="opt-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="5" width="18" height="16" rx="2"/>
            <path d="M3 10h18"/>
            <path d="M8 3v4M16 3v4"/>
            <path d="M8 14h2M14 14h2M8 18h2"/>
          </svg>
        </div>
        <div class="opt-text">
          <span class="opt-name">יומן Google</span>
          <span class="opt-desc">נפתח בדפדפן</span>
        </div>
      </a>

      <button class="sheet-cancel" onclick="closeSheet()">ביטול</button>
    </div>
  </div>

  <script>
    function openSheet() {
      var gcal = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
        + '&text=' + encodeURIComponent('החתונה של הדר ויהונתן')
        + '&dates=20260904T150000/20260904T220000'
        + '&details=' + encodeURIComponent('מונא, שמואל הנגיד 12, ירושלים')
        + '&location=' + encodeURIComponent('מונא, שמואל הנגיד 12, ירושלים');
      document.getElementById('gcal-link').href = gcal;
      document.getElementById('overlay').classList.add('open');
    }

    function closeSheet() {
      document.getElementById('overlay').classList.remove('open');
    }

    function maybeClose(e) {
      if (e.target === document.getElementById('overlay')) closeSheet();
    }

    function downloadICS() {
      var lines = [
        'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Wedding//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
        'BEGIN:VEVENT','UID:hadar-yehonatan@2026','DTSTART:20260904T150000','DTEND:20260904T220000',
        'SUMMARY:החתונה של הדר ויהונתן',
        'DESCRIPTION:מונא\\, שמואל הנגיד 12\\, ירושלים',
        'LOCATION:מונא\\, שמואל הנגיד 12\\, ירושלים',
        'STATUS:CONFIRMED','TRANSP:OPAQUE',
        'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:החתונה מחר!','END:VALARM',
        'END:VEVENT','END:VCALENDAR'
      ].join('\r\n');
      var blob = new Blob([lines], {type:'text/calendar;charset=utf-8'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'hadar-yehonatan-wedding.ics';
      a.click();
      URL.revokeObjectURL(url);
      setTimeout(closeSheet, 300);
    }
  </script>
</body>
</html>
