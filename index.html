<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="light"/>
  <title>Hadar & Yehonatan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --bg:        #faf6f1;
      --gold:      #b08968;
      --gold-soft: #d4baa0;
      --text:      #2a2a2a;
      --muted:     #7a7066;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Playfair Display', Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(env(safe-area-inset-top), 56px) 28px max(env(safe-area-inset-bottom), 56px);
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    .header {
      text-align: center;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .eyebrow {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--gold);
      padding-left: 0.42em;
    }

    .divider {
      width: 88px;
      height: 1px;
      background: var(--gold);
      opacity: 0.65;
    }

    .names {
      font-size: clamp(2.2rem, 9.5vw, 2.8rem);
      font-weight: 500;
      font-style: italic;
      line-height: 1.15;
      color: var(--text);
    }

    .heart-icon {
      width: 30px;
      height: 30px;
      color: var(--gold);
      animation: heartbeat 2.6s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15%, 35% { transform: scale(1.12); }
      25%, 45% { transform: scale(0.96); }
    }

    .timer {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
    }

    .t-unit {
      background: #ffffff;
      border: 1px solid var(--gold-soft);
      border-radius: 4px;
      padding: 18px 6px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .t-num {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.7rem, 7.5vw, 2.1rem);
      font-weight: 500;
      line-height: 1;
      color: var(--text);
    }
    .t-num.tick { animation: bounce 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes bounce {
      0%   { transform: scale(0.92); }
      50%  { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    .t-lbl {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.62rem;
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .event-info {
      text-align: center;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .event-date {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.5rem, 6.5vw, 1.9rem);
      font-weight: 500;
      letter-spacing: 0.08em;
    }

    .event-location {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      margin-top: 4px;
    }

    .btn {
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 2px;
      padding: 16px 22px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.76rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-left: calc(22px + 0.3em);
    }

    .btn:hover, .btn:active {
      background: var(--gold);
      color: #fff;
    }

    #celebration { display: none; }

    .celeb-content {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      width: 100%;
    }

    .celeb-content .heart-icon { width: 44px; height: 44px; }

    .celeb-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 8vw, 2.6rem);
      font-weight: 500;
      font-style: italic;
      line-height: 1.2;
    }

    .celeb-subtitle {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Bottom sheet */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 18, 14, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 500;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }

    .sheet {
      width: 100%;
      background: var(--bg);
      border-radius: 20px 20px 0 0;
      padding: 14px 22px max(env(safe-area-inset-bottom), 32px);
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.32,0.72,0,1);
    }
    .overlay.open .sheet { transform: translateY(0); }

    .handle {
      width: 42px;
      height: 3px;
      background: var(--gold-soft);
      border-radius: 2px;
      margin: 0 auto 22px;
    }

    .sheet-title {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      text-align: center;
      color: var(--gold);
      margin-bottom: 18px;
      padding-left: 0.32em;
    }

    .opt {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      border: 1px solid var(--gold-soft);
      border-radius: 4px;
      margin-bottom: 10px;
      cursor: pointer;
      text-decoration: none;
      color: var(--text);
      background: #fff;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .opt:hover, .opt:active {
      background: #fbf6ef;
      border-color: var(--gold);
    }

    .opt-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      color: var(--gold);
    }

    .opt-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .opt-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.02rem;
      font-weight: 500;
    }

    .opt-desc {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .sheet-cancel {
      width: 100%;
      padding: 16px;
      margin-top: 6px;
      background: transparent;
      border: 1px solid var(--gold);
      border-radius: 2px;
      color: var(--gold);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, color 0.15s;
      padding-left: calc(16px + 0.3em);
    }
    .sheet-cancel:hover, .sheet-cancel:active {
      background: var(--gold);
      color: #fff;
    }
  </style>
</head>

<body>
  <main>

    <div class="header">
      <div class="eyebrow">save the date</div>
      <div class="divider"></div>
      <div class="names">Hadar &amp; Yehonatan</div>
      <svg class="heart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 20.5s-7-4.4-7-10.4C5 6.7 6.9 5 9 5c1.4 0 2.4 0.9 3 2 0.6-1.1 1.6-2 3-2 2.1 0 4 1.7 4 5.1 0 6-7 10.4-7 10.4z"/>
      </svg>
    </div>

    <div id="countdown-section" style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 32px;">

      <div class="timer" id="timer-grid"></div>

      <div class="event-info">
        <div class="event-date">04 . 09 . 2026</div>
        <div class="event-location">Mona &middot; Jerusalem</div>
      </div>

      <div class="button-group">
        <button class="btn" onclick="openSheet()">Add to Calendar</button>
        <a class="btn" href="https://ul.waze.com/ul?q=Mona%20Jerusalem&navigate=yes" target="_blank" rel="noopener">Navigate</a>
        <a class="btn" href="https://open.spotify.com/playlist/3K7p8dvlss3klkHgZacXag?si=Ttohk8EtRuGqMfXL3Uy9BA&pi=2SG9bgXJRtGEJ" target="_blank" rel="noopener">Playlist</a>
      </div>
    </div>

    <div id="celebration">
      <div class="celeb-content">
        <svg class="heart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 20.5s-7-4.4-7-10.4C5 6.7 6.9 5 9 5c1.4 0 2.4 0.9 3 2 0.6-1.1 1.6-2 3-2 2.1 0 4 1.7 4 5.1 0 6-7 10.4-7 10.4z"/>
        </svg>

        <div class="celeb-title">The day is here</div>
        <div class="celeb-subtitle">with love</div>

        <div class="event-info">
          <div class="event-date">Hadar &amp; Yehonatan</div>
          <div class="event-location">04 . 09 . 2026 &middot; Mona Jerusalem</div>
        </div>

        <div class="button-group">
          <button class="btn" onclick="openSheet()">Add to Calendar</button>
          <a class="btn" href="https://ul.waze.com/ul?q=Mona%20Jerusalem&navigate=yes" target="_blank" rel="noopener">Navigate</a>
          <a class="btn" href="https://open.spotify.com/playlist/3K7p8dvlss3klkHgZacXag?si=Ttohk8EtRuGqMfXL3Uy9BA&pi=2SG9bgXJRtGEJ" target="_blank" rel="noopener">Playlist</a>
        </div>
      </div>
    </div>

  </main>

  <div class="overlay" id="overlay" onclick="maybeClose(event)">
    <div class="sheet">
      <div class="handle"></div>
      <p class="sheet-title">add to calendar</p>

      <div class="opt" onclick="downloadICS()">
        <div class="opt-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="5" width="18" height="16" rx="2"/>
            <path d="M3 10h18"/>
            <path d="M8 3v4M16 3v4"/>
          </svg>
        </div>
        <div class="opt-text">
          <span class="opt-name">Apple Calendar</span>
          <span class="opt-desc">Download .ics file</span>
        </div>
      </div>

      <a class="opt" id="gcal-link" href="#" target="_blank" rel="noopener">
        <div class="opt-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="5" width="18" height="16" rx="2"/>
            <path d="M3 10h18"/>
            <path d="M8 3v4M16 3v4"/>
            <path d="M8 14h2M14 14h2M8 18h2"/>
          </svg>
        </div>
        <div class="opt-text">
          <span class="opt-name">Google Calendar</span>
          <span class="opt-desc">Opens in browser</span>
        </div>
      </a>

      <button class="sheet-cancel" onclick="closeSheet()">Cancel</button>
    </div>
  </div>

  <script>
    var TARGET = new Date('2026-09-04T15:00:00');
    var UNITS = [{id:'d',lbl:'Days'},{id:'h',lbl:'Hours'},{id:'m',lbl:'Mins'},{id:'s',lbl:'Secs'}];

    var grid = document.getElementById('timer-grid');
    UNITS.forEach(function(u) {
      var cell = document.createElement('div');
      cell.className = 't-unit';
      var num = document.createElement('span');
      num.id = u.id; num.className = 't-num'; num.textContent = '00';
      var lbl = document.createElement('span');
      lbl.className = 't-lbl'; lbl.textContent = u.lbl;
      cell.appendChild(num); cell.appendChild(lbl); grid.appendChild(cell);
    });

    function pad(n) { return String(Math.max(0,n)).padStart(2,'0'); }

    function set(id, val) {
      var el = document.getElementById(id);
      if (!el) return;
      var p = pad(val);
      if (el.textContent !== p) {
        el.textContent = p;
        el.classList.remove('tick');
        void el.offsetWidth;
        el.classList.add('tick');
      }
    }

    function tick() {
      var diff = TARGET - new Date();
      if (diff <= 0) {
        set('d',0); set('h',0); set('m',0); set('s',0);
        document.getElementById('countdown-section').style.display = 'none';
        document.getElementById('celebration').style.display = 'block';
        return;
      }
      var t = Math.floor(diff / 1000);
      set('d', Math.floor(t / 86400));
      set('h', Math.floor((t % 86400) / 3600));
      set('m', Math.floor((t % 3600) / 60));
      set('s', t % 60);
      var delay = 1000 - (diff % 1000);
      if (delay < 50) delay += 1000;
      setTimeout(tick, delay);
    }
    tick();

    function openSheet() {
      var gcal = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
        + '&text=Hadar+%26+Yehonatan%27s+Wedding'
        + '&dates=20260904T150000/20260904T220000'
        + '&details=Join+us+at+Mona+Jerusalem!'
        + '&location=Mona+Jerusalem';
      document.getElementById('gcal-link').href = gcal;
      document.getElementById('overlay').classList.add('open');
    }

    function closeSheet() {
      document.getElementById('overlay').classList.remove('open');
    }

    function maybeClose(e) {
      if (e.target === document.getElementById('overlay')) closeSheet();
    }

    function downloadICS() {
      var lines = [
        'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Wedding//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
        'BEGIN:VEVENT','UID:hadar-yehonatan@2026','DTSTART:20260904T150000','DTEND:20260904T220000',
        'SUMMARY:Hadar & Yehonatan\'s Wedding','DESCRIPTION:Mona Jerusalem','LOCATION:Mona Jerusalem',
        'STATUS:CONFIRMED','TRANSP:OPAQUE',
        'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:Wedding tomorrow!','END:VALARM',
        'END:VEVENT','END:VCALENDAR'
      ].join('\r\n');
      var blob = new Blob([lines], {type:'text/calendar'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'hadar-yehonatan-wedding.ics';
      a.click();
      URL.revokeObjectURL(url);
      setTimeout(closeSheet, 300);
    }
  </script>
</body>
</html>
